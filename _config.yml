# Root GitHub Pages config (we don't actually use Jekyll to build)
# Make sure Jekyll (if it runs) does NOT touch Eleventy sources.
exclude:
  - blog-src
  - node_modules
  - scripts
  - .github
  - .eleventy.js
  - package.json
  - package-lock.json
  - blog-local
  - README*
# Keep the built blog folder as-is
keep_files:
  - blog
