name: Auto Blog (Generate Posts)

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов
  workflow_dispatch:         # ручной запуск

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install openai feedparser beautifulsoup4

      - name: Generate blog post(s)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f generate.py ]; then
            python generate.py --auto || python generate.py
          fi
          if [ -f rebuild_index.py ]; then
            python rebuild_index.py || true
          fi

      - name: Debug — list generated sources
        run: |
          echo "=== blog-src/posts/ ==="
          ls -R blog-src/posts || echo "No posts created"

      - name: Commit new sources
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog-src/posts data/state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-blog): add new generated post(s)"
            git push
          else
            echo "No new posts to commit"
          fi
