name: Auto Blog (Generate Posts)

on:
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов
  workflow_dispatch:         # ручной запуск

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate blog post(s)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run generate:posts

      - name: Debug — list generated sources
        run: |
          echo "=== blog-src/posts/ ==="
          ls -R blog-src/posts || echo "No posts created"
          echo "=== data/automation-state.json ==="
          cat data/automation-state.json || echo "No automation-state.json file"
          if [ -f data/used_headlines.json ]; then
            echo "=== data/used_headlines.json ==="
            head -n 50 data/used_headlines.json
          fi

      - name: Commit new sources (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog-src/posts data/automation-state.json
          if [ -f data/used_headlines.json ]; then git add data/used_headlines.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-blog): add/update generated post(s) and automation state"
            git push
          else
            echo "No changes to commit"
