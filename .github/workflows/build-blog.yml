name: Build Blog

on:
  push:
    branches: [ main ]
    paths:
      - 'blog-src/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.nojekyll'
      - '.github/workflows/build-blog.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Clean blog output
        run: rm -rf blog/* || true

      - name: Build blog with Eleventy
        run: |
          npx @11ty/eleventy --input=blog-src --output=blog
          echo "" > blog/.nojekyll

      - name: Debug: list built files
        run: |
          echo "=== FILES IN /blog AFTER BUILD ==="
          ls -R blog

      - name: Commit blog output (if changed, include deletions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f blog
          if ! git diff --cached --quiet; then
            git commit -m "chore(blog): build Eleventy site"
            git push
          else
            echo "No changes to commit"
          fi
