name: Build Blog

on:
  push:
    paths:
      - 'blog-src/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
  schedule:
    - cron: '0 6 * * *'   # rebuild every night at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy
        run: npm run build

      - name: Generate OG images
        run: npm run build:og

      - name: Commit blog output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          if ! git diff --cached --quiet; then
            git commit -m "chore(blog): build at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes in /blog to commit."
          fi
