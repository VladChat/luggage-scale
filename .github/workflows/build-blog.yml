name: Build Blog to /blog

on:
  push:
    branches: [ "main" ]
    paths:
      - 'blog-src/**'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch: {}

jobs:
  build-blog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build Eleventy
        run: npm run build   # вывод попадёт в ../blog

      - name: Commit generated /blog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(blog): build blog to /blog [skip ci]"
          file_pattern: blog/**
          add_options: "-A"
