name: Build Blog (/blog-src → /blog)

on:
  workflow_dispatch:
  push:
    paths:
      - "blog-src/**"
      - ".github/workflows/build-blog.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Build blog into /blog
        run: |
          hugo -s blog-src -d ../blog

      - name: Commit and push /blog changes only
        run: |
          if [[ -n "$(git status --porcelain blog)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blog
            git commit -m "Build blog: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
            git push
          else
            echo "No changes in /blog"
          fi
