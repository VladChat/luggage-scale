name: Build Blog to /blog

on:
  push:
    branches: [ "main" ]
    paths:
      - 'blog-src/**'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch: {}

jobs:
  build-blog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Отладка: покажем структуру репозитория
      - name: Debug tree
        run: |
          pwd
          ls -la
          echo "---- parent dir ----"
          ls -la ..

      # Главное исправление: вместо npm ci (требует package-lock.json)
      - name: Install deps
        run: npm install

      - name: Build Eleventy
        run: npm run build   # .eleventy.js пишет в ../blog

      # Отладка: убедимся, что файлы появились
      - name: Show blog output
        run: |
          echo "---- /blog after build ----"
          ls -la ../blog || true

      - name: Commit generated /blog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(blog): build blog to /blog [skip ci]"
          file_pattern: blog/**
          add_options: "-A"
