name: Build Blog

on:
  push:
    paths:
      - 'blog-src/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # once daily ~03:17 UTC to publish scheduled posts

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build blog with Eleventy
        run: |
          npx @11ty/eleventy --input=blog-src --output=blog
          echo "" > blog/.nojekyll

      - name: Commit blog output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          if ! git diff --cached --quiet; then
            git commit -m "chore(blog): build Eleventy site"
            git push
          else
            echo "No changes to commit"
          fi
