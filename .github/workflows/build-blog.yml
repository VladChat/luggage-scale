name: Build Blog (/blog-src → /blog)

on:
  workflow_dispatch:
  push:
    paths:
      - "blog-src/**"
      - ".github/workflows/build-blog.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Build blog into /blog
        run: |
          hugo -s blog-src -d ../blog

      - name: Commit and push /blog changes only
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog
          if git diff --cached --quiet; then
            echo "No changes in /blog"
          else
            git commit -m "Build blog: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
            git push origin HEAD:main
          fi
