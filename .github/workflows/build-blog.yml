name: Build Blog

on:
  push:
    branches: [ main ]
    paths:
      - 'blog-src/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.nojekyll'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Clean blog output
        run: rm -rf blog/* || true

      - name: Build blog with Eleventy
        run: |
          ELEVENTY_ENV=prod node ./node_modules/@11ty/eleventy/cmd.js --input=blog-src --output=blog
          echo "" > blog/.nojekyll

      - name: Debug — list built files
        run: |
          echo "=== FILES IN /blog AFTER BUILD ==="
          ls -R blog || echo "No files found in /blog"

      - name: Debug — show start of index.html
        run: |
          echo "=== START OF /blog/index.html ==="
          head -n 30 blog/index.html || echo "index.html not found"
          echo "=== END OF DEBUG OUTPUT ==="

      - name: Validate canonical blog URLs
        run: |
          if grep -R -n "/blog/blog/" blog; then
            echo "Error: found duplicated /blog/blog/ paths in generated output."
            exit 1
          fi

      - name: Commit blog output (if changed, include deletions)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog
          if ! git diff --cached --quiet; then
            git commit -m "chore(blog): build Eleventy site"
            git push
          else
            echo "No changes to commit"
