name: Build Blog

on:
  push:
    branches: [ main ]
    paths:
      - 'blog_src/**'
      - '.github/workflows/blog-build.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Blog Writer"]   # запускаться после завершения Writer
    types: [completed]           # джоб бежит только при success (см. if ниже)

permissions:
  contents: write

jobs:
  build:
    # если пришли по workflow_run — бежим только при success
    # если push/dispatch — условие истинно
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (branch, not SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ВАЖНО: всегда ветка, чтобы не было detached HEAD
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.150.1'   # можно вернуть '0.146.0' при желании
          extended: true

      - name: Build Hugo → /blog
        run: |
          # Полная пересборка блога с очисткой предыдущих артефактов
          hugo --minify --cleanDestinationDir -s blog_src -d ../blog
          # Проверка, что sitemap.xml создан успешно
          test -f blog/sitemap.xml && echo "sitemap OK" || (echo "sitemap MISSING" && exit 1)

      - name: Debug sitemap files
        run: |
          echo "Sitemap files in build:"
          find blog -type f -name "sitemap*.xml" -printf "%p (%TY-%Tm-%Td %TH:%TM)\n"

      - name: Commit & Push built blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Добавляем все типы файлов (включая .xml, .json, .txt) и учитываем удаления
          git add -Af blog/
          git commit -m "Update blog build [skip ci]" || echo "No changes"
          # HEAD теперь на ветке (не detached), обычный push работает
          git push
