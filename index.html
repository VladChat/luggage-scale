<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>

  <!-- Instant redirect -->
  <meta http-equiv="refresh" content="0; url=flight-baggage-limits.html" />

  <!-- Nice-to-haves -->
  <link rel="canonical" href="flight-baggage-limits.html" />
  <meta name="robots" content="noindex" />

  <style>
    /* Optional: matches your dark theme while redirect happens */
    body{margin:0;background:#0a1a2f;color:#f0f8ff;
         font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    a{color:#4db8ff}
    .card{max-width:720px;background:#0f2542;border:1px solid #2c4566;
          padding:20px;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
  </style>

  <script>
    // JS fallback in case meta refresh is blocked
    window.location.replace('flight-baggage-limits.html');
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Redirecting…</h1>
      <p>If you’re not redirected automatically, <a href="flight-baggage-limits.html">click here</a>.</p>
    </div>
  </div>
</body>
</html>
