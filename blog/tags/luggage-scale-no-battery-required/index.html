<script>
document.addEventListener("DOMContentLoaded", function () {
  const postContent = document.querySelector(".post-content");
  if (!postContent) return;

  
  const nodes = Array.from(postContent.children);
  const sections = [];
  let cur = null;

  nodes.forEach(node => {
    if (node.tagName === "H2") {
      if (cur) sections.push(cur);
      cur = { h: node, body: [] };
    } else if (cur) {
      cur.body.push(node);
    }
  });
  if (cur) sections.push(cur);

  if (sections.length < 2) return; 

  
  postContent.innerHTML = "";

  
  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SCROLL_OFFSET = getScrollOffset(); 
  function getScrollOffset() {
    
    const css = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue("--accordion-offset"));
    return Number.isFinite(css) ? css : 96; 
  }
  function recalcOpenHeights() {
    postContent.querySelectorAll(".accordion-section.open .accordion-content")
      .forEach(c => c.style.maxHeight = c.scrollHeight + "px");
  }

  sections.forEach((sec, idx) => {
    const wrapper = document.createElement("section");
    wrapper.className = "accordion-section" + (idx === 0 ? " open" : "");
    
    wrapper.style.scrollMarginTop = SCROLL_OFFSET + "px";

    const header = document.createElement("button");
    header.type = "button";
    header.className = "accordion-header";
    header.setAttribute("aria-expanded", idx === 0 ? "true" : "false");
    header.textContent = sec.h.textContent;

    const content = document.createElement("div");
    content.className = "accordion-content";
    
    content.style.overflow = "hidden";
    content.style.transition = "max-height 320ms cubic-bezier(.2,.7,.3,1)";
    content.style.maxHeight = idx === 0 ? "0px" : "0px"; 
    sec.body.forEach(el => content.appendChild(el));

    
    requestAnimationFrame(() => {
      if (idx === 0) {
        wrapper.classList.add("open");
        header.setAttribute("aria-expanded", "true");
        content.style.maxHeight = content.scrollHeight + "px";
      }
    });

    
    content.querySelectorAll("img").forEach(img => {
      img.addEventListener("load", () => {
        if (wrapper.classList.contains("open")) {
          content.style.maxHeight = content.scrollHeight + "px";
        }
      });
    });

    header.addEventListener("click", () => {
      const willOpen = !wrapper.classList.contains("open");

      
      postContent.querySelectorAll(".accordion-section.open").forEach(secEl => {
        if (secEl === wrapper) return;
        secEl.classList.remove("open");
        const c = secEl.querySelector(".accordion-content");
        const h = secEl.querySelector(".accordion-header");
        if (c) c.style.maxHeight = "0px";
        if (h) h.setAttribute("aria-expanded", "false");
      });

      if (willOpen) {
        wrapper.classList.add("open");
        header.setAttribute("aria-expanded", "true");

        
        content.style.maxHeight = "0px";
        
        content.offsetHeight;
        content.style.maxHeight = content.scrollHeight + "px";

        const scrollAfter = () => {
          wrapper.scrollIntoView({ behavior: "smooth", block: "start" });
        };
        
        if (prefersReduced) {
          scrollAfter();
        } else {
          content.addEventListener("transitionend", scrollAfter, { once: true });
        }
      } else {
        
        wrapper.classList.remove("open");
        header.setAttribute("aria-expanded", "false");
        content.style.maxHeight = "0px";
      }
    });

    wrapper.appendChild(header);
    wrapper.appendChild(content);
    postContent.appendChild(wrapper);
  });

  
  window.addEventListener("resize", recalcOpenHeights, { passive: true });
});
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const isFaqTitle = (txt) => /(^|\b)(faq|frequently asked questions|вопросы|вопрос-ответ)/i.test(txt.trim());

  function buildFaqAccordion(root) {
    if (!root) return;

    const text = root.innerText;
    const parts = text.split(/(?=Q:)/i).map(s => s.trim()).filter(Boolean);

    const items = [];
    parts.forEach(p => {
      const match = p.match(/^Q:\s*(.+?)(?:\s*A:\s*(.+))?$/is);
      if (match) {
        items.push({
          q: match[1].trim(),
          a: (match[2] || "").trim()
        });
      }
    });

    if (!items.length) return;

    const cont = document.createElement('div');
    cont.className = 'faq-accordion';

    items.forEach((it, idx) => {
      const item = document.createElement('div');
      item.className = 'faq-item' + (idx === 0 ? ' open' : '');

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'faq-q';
      btn.setAttribute('aria-expanded', idx === 0 ? 'true' : 'false');
      btn.innerHTML = `<span class="label">❓ ${it.q}</span><span class="mark">+</span>`;

      const ans = document.createElement('div');
      ans.className = 'faq-a';
      ans.innerHTML = `<div class="faq-a-inner"><p>${it.a}</p></div>`;

      const inner = ans.firstElementChild;

      
      if (idx === 0) {
        requestAnimationFrame(() => {
          ans.style.maxHeight = (inner.scrollHeight + 2) + 'px';
        });
      }

      btn.addEventListener('click', () => {
        const willOpen = !item.classList.contains('open');

        
        cont.querySelectorAll('.faq-item').forEach(el => {
          if (el !== item) {
            el.classList.remove('open');
            el.querySelector('.faq-a').style.maxHeight = '0px';
            el.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
          }
        });

        item.classList.toggle('open', willOpen);
        btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');

        if (willOpen) {
          
          requestAnimationFrame(() => {
            ans.style.maxHeight = (inner.scrollHeight + 2) + 'px'; 
          });
        } else {
          ans.style.maxHeight = '0px';
        }
      });

      item.appendChild(btn);
      item.appendChild(ans);
      cont.appendChild(item);
    });

    root.innerHTML = "";
    root.appendChild(cont);

    
    const recalcOpenHeights = () => {
      cont.querySelectorAll('.faq-item.open').forEach(el => {
        const a = el.querySelector('.faq-a');
        const inner = el.querySelector('.faq-a-inner');
        a.style.maxHeight = (inner.scrollHeight + 2) + 'px';
      });
    };
    window.addEventListener('resize', recalcOpenHeights, { passive: true });
    cont.querySelectorAll('img').forEach(img => img.addEventListener('load', recalcOpenHeights, { once:true }));
  }

  
  setTimeout(() => {
    let faqContent = null;
    document.querySelectorAll('.accordion-section').forEach(sec => {
      const h = sec.querySelector('.accordion-header');
      if (h && isFaqTitle(h.textContent)) {
        faqContent = sec.querySelector('.accordion-content');
      }
    });
    if (faqContent) buildFaqAccordion(faqContent);
  }, 0);
});
</script>

</style><script>
document.addEventListener("DOMContentLoaded", function () {
  const root = document.querySelector(".post-content");
  if (!root) return;

  const icons = {
    unread: "<svg viewBox='0 0 24 24'><rect x='4' y='4' width='16' height='16' rx='2'/></svg>",
    active: "<svg viewBox='0 0 24 24'><circle cx='12' cy='12' r='8'/></svg>",
    read:   "<svg viewBox='0 0 24 24'><path d='M4 12l5 5 11-11'/></svg>"
  };

  function buildTitleSpan(header) {
    let titleSpan = header.querySelector('.acc-title');
    if (titleSpan) {
      header.setAttribute('title', titleSpan.textContent || '');
      return;
    }

    const badge = header.querySelector('.read-badge');
    const parts = [];
    header.childNodes.forEach(n => {
      if (badge && n === badge) return;
      if (n.nodeType === Node.TEXT_NODE) parts.push(n.nodeValue);
      else if (n.nodeType === Node.ELEMENT_NODE && !n.classList.contains('anchor'))
        parts.push(n.textContent || '');
    });

    let title = parts.join(' ').replace(/\\s+/g, ' ').trim();
    title = title.replace(/\\s*#\\s*$/, '');

    const hadBadge = !!badge;
    header.textContent = '';
    if (hadBadge) header.appendChild(badge);

    titleSpan = document.createElement('span');
    titleSpan.className = 'acc-title';
    titleSpan.textContent = title;
    header.appendChild(document.createTextNode(' '));
    header.appendChild(titleSpan);
    header.setAttribute('title', title);
  }

  const sections = root.querySelectorAll('.accordion-section');
  sections.forEach(sec => {
    const header = sec.querySelector('.accordion-header');
    if (!header) return;

    if (!header.querySelector('.read-badge')) {
      const badge = document.createElement('span');
      badge.className = 'read-badge';
      badge.innerHTML = icons.unread + 'TO READ';
      header.insertBefore(badge, header.firstChild);
    }

    buildTitleSpan(header);
  });

  root.addEventListener('click', e => {
    const header = e.target.closest('.accordion-header');
    if (!header) return;
    const badge = header.querySelector('.read-badge');
    if (!badge) return;

    root.querySelectorAll('.read-badge.active').forEach(b => {
      b.classList.remove('active');
      b.classList.add('read');
      b.innerHTML = icons.read + 'READ';
    });

    badge.classList.remove('read');
    badge.classList.add('active');
    badge.innerHTML = icons.active + 'READING...';
    buildTitleSpan(header);
  });

  sections.forEach(sec => {
    if (sec.classList.contains('open')) {
      const header = sec.querySelector('.accordion-header');
      const badge = sec.querySelector('.read-badge');
      if (badge) {
        badge.classList.add('active');
        badge.innerHTML = icons.active + 'READING...';
      }
      if (header) buildTitleSpan(header);
    }
  });
});
</script>

<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });
</script>
<script>
    var mybutton = document.getElementById("top-link");
    window.onscroll = function () {
        if (document.body.scrollTop > 800 || document.documentElement.scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };
</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        if (document.body.className.includes("dark")) {
            document.body.classList.remove('dark');
            localStorage.setItem("pref-theme", 'light');
        } else {
            document.body.classList.add('dark');
            localStorage.setItem("pref-theme", 'dark');
        }
    })
</script>
