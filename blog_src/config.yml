baseURL: "https://luggage-scale.com/blog/"
title: "Luggage Scale"
theme: "PaperMod"
publishDir: "../blog"

canonifyURLs: false
relativeURLs: false
uglyURLs: false
layoutDir: "layouts"

server:
  baseURLRedirects: false

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

enableGitInfo: true

frontmatter:
  lastmod:
    - lastmod
    - :git
    - :fileModTime
    - :default

permalinks:
  posts: "/posts/:year/:month/:day/:slug/"

outputs:
  home: [HTML, RSS, JSON, Sitemap]
  section: [HTML, RSS, Sitemap]
  taxonomy: [HTML, RSS, Sitemap]
  term: [HTML, RSS, Sitemap]
  page: [HTML]

taxonomies:
  category: categories
  tag: tags

params:
  disableAnchoredHeadings: true
  env: production
  title: "uPatch Luggage Scale"
  description: "Discover airline baggage limits, smart packing tips, and flight travel resources. Learn how to avoid overweight fees with the uPatch Luggage Scale — your reliable, battery-free travel companion."
  keywords: ["airline baggage limits", "carry-on size guide", "checked luggage rules", "travel weight scale", "uPatch luggage scale", "smart packing tips", "flight baggage allowance", "overweight luggage fees", "travel essentials", "battery-free luggage scale"]
  author: "uPatch Editorial"
  customFooterText: "© 2025 Luggage Scale Blog. All rights reserved."
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  centerTheme: true
  label:
    text: "Luggage Scale"
    icon: "favicon.svg"
    iconHeight: 32
  assets:
    favicon: "favicon.svg"
  disableGA: true

  # 👇 вот эти две строки теперь точно работают
  ShowRelatedPosts: true
  relatedPosts:
    count: 4
    threshold: 0
    includeNewer: true
    sortByDate: false

privacy:
  googleAnalytics:
    anonymizeIP: true
  youtube:
    privacyEnhanced: true

related:
  threshold: 60          # чувствительность; можно 80 если хочешь более строгую релевантность
  includeNewer: true     # разрешить искать и более новые статьи
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

menu:
  main:
    - identifier: home
      name: Home
      url: "/"
      weight: 1
    - identifier: shop
      name: Shop
      url: "../shop.html"
      weight: 2

  footer:
    - identifier: privacy
      name: Privacy Policy
      url: "/privacy-policy/"
      weight: 1
    - identifier: terms
      name: Terms of Service
      url: "/terms/"
      weight: 2
    - identifier: sitemap
      name: Sitemap
      url: "/sitemap.xml"
      weight: 3
      
mediaTypes:
  "text/html":
    charset: "utf-8"
