baseURL: "https://luggage-scale.com/blog/"
title: "Luggage Scale"
theme: "PaperMod"
publishDir: "../blog"
canonifyURLs: true
relativeURLs: false

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

enableGitInfo: true

frontmatter:
  lastmod:
    - lastmod
    - :git
    - :fileModTime
    - :default

permalinks:
  posts: "/posts/:year/:month/:day/:slug/"

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - Sitemap
  section:
    - HTML
    - RSS
    - Sitemap
  taxonomy:
    - HTML
    - RSS
    - Sitemap
  term:
    - HTML
    - RSS
    - Sitemap
  page:
    - HTML

taxonomies:
  category: categories
  tag: tags

params:
  disableAnchoredHeadings: true
  env: production
  title: "Luggage Scale"
  description: "Find airline baggage limits, packing tips, and travel guides to avoid overweight fees. Use the uPatch Luggage Scale — the smart, battery-free way to travel light."
  keywords:
    - "airline baggage limits"
    - "carry-on size guide"
    - "checked bag allowance"
    - "travel packing tips"
    - "uPatch luggage scale"
    - "battery-free luggage scale"
    - "lightweight travel gear"
    - "overweight luggage fees"
    - "smart travel accessories"
    - "flight baggage rules"
    - "travel weight checker"
  author: "Luggage Scale Blog"
  customFooterText: "© 2025 Luggage Scale Blog. All rights reserved."
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  centerTheme: true
  label:
    text: "Luggage Scale"
    icon: "favicon.svg"
    iconHeight: 32
  assets:
    favicon: "favicon.svg"
  disableGA: true

privacy:
  googleAnalytics:
    anonymizeIP: true
  youtube:
    privacyEnhanced: true

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

menu:
  main:
    - identifier: home
      name: Home
      url: "/"  # это даст https://luggage-scale.com/blog/
      weight: 1
    - identifier: shop
      name: Shop
      url: "https://luggage-scale.com/shop.html"
      weight: 2
    - identifier: manual
      name: Manual
      url: "https://luggage-scale.com/manual.html"
      weight: 3

  footer:
    - identifier: privacy
      name: Privacy Policy
      url: "/privacy-policy/"
      weight: 1
    - identifier: terms
      name: Terms of Service
      url: "/terms/"
      weight: 2
    - identifier: sitemap
      name: Sitemap
      url: "/sitemap.xml"
      weight: 3
