baseURL: "https://luggage-scale.com/blog/"
title: "Luggage Scale"
theme: "PaperMod"
publishDir: "../blog"
canonifyURLs: false
relativeURLs: false

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# включаем GitInfo, чтобы lastmod брался из даты последнего коммита
enableGitInfo: true

# настраиваем приоритет для lastmod
frontmatter:
  lastmod:
    - lastmod      # если указан lastmod в front-matter
    - :git         # иначе Hugo возьмет дату последнего коммита
    - :fileModTime # если git недоступен — дату изменения файла
    - :default     # fallback: date

permalinks:
  posts: "/posts/:year/:month/:day/:slug/"

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - Sitemap
  section:
    - HTML
    - RSS
    - Sitemap
  taxonomy:
    - HTML
    - RSS
    - Sitemap
  term:
    - HTML
    - RSS
    - Sitemap
  page:
    - HTML

taxonomies:
  category: categories
  tag: tags

params:
  env: production
  title: "Luggage Scale"
  description: "Travel news, helpful resources, and useful guides."
  keywords: ["luggage", "baggage limits", "travel tips", "packing guides", "smart travel"]
  author: "Luggage Scale Blog"
  customFooterText: "© 2025 Luggage Scale Blog. All rights reserved."
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  assets:
    favicon: "favicon.svg"
  disableGA: true   # отключаем google_analytics.html, чтобы не было ошибки

privacy:
  googleAnalytics:
    anonymizeIP: true
  youtube:
    privacyEnhanced: true

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

menu:
  main:
    - identifier: home
      name: Home
      url: "/"
      weight: 1
    - identifier: shop
      name: Shop
      url: "../shop.html"
      weight: 2
    - identifier: manual
      name: Manual
      url: "../manual.html"
      weight: 3

  footer:
    - identifier: privacy
      name: Privacy Policy
      url: "/privacy-policy/"
      weight: 1
    - identifier: terms
      name: Terms of Service
      url: "/terms/"
      weight: 2
    - identifier: sitemap
      name: Sitemap
      url: "/sitemap.xml"
      weight: 3
