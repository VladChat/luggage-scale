baseURL: "https://luggage-scale.com/blog/"
theme: "PaperMod"
publishDir: "../blog"

canonifyURLs: true
relativeURLs: false
uglyURLs: false
layoutDir: "layouts"

server:
  baseURLRedirects: false
pagination:
  pagerSize: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false
enableGitInfo: false

frontmatter:
  date:
    - :filename
    - date
    - publishDate
    - :default
  lastmod:
    - lastmod
    - :default

permalinks:
  posts: "/posts/:year/:month/:day/:slug/"

outputs:
  home: [HTML, RSS, JSON, Sitemap]
  section: [HTML, RSS, Sitemap]
  taxonomy: [HTML, RSS, Sitemap]
  term: [HTML, RSS, Sitemap]
  page: [HTML]

taxonomies:
  category: categories
  tag: tags

params:
  env: production
  title: "uPatch"
  tagline: "Luggage Scale"
  description: "Travel smarter with real-time updates, expert packing guides, and practical tips for efficient, organized journeys. Luggage Scale"
  keywords: ["airline baggage limits", "carry-on size guide", "checked luggage rules", "travel weight scale", "uPatch luggage scale", "smart packing tips", "flight baggage allowance", "overweight luggage fees", "travel essentials", "battery-free luggage scale"]
  author: "uPatch Editorial"
  customFooterText: "© 2025 Luggage Scale Blog. All rights reserved."
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  centerTheme: true
  disableAnchoredHeadings: true
  disableGA: true
  label:
    text: "Luggage Scale"
    icon: "favicon.svg"
    iconHeight: 32
  assets:
    favicon: "favicon.svg"
  ShowRelatedPosts: true
  relatedPosts:
    count: 4
    threshold: 0
    includeNewer: true
    sortByDate: false

privacy:
  googleAnalytics:
    anonymizeIP: true
  youtube:
    privacyEnhanced: true

related:
  threshold: 60
  includeNewer: true
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

menu:
  main:
    - identifier: home
      name: Home
      url: "/"
      weight: 1
    - identifier: shop
      name: Shop
      url: "https://luggage-scale.com/shop.html"
      weight: 2

  footer:
    - identifier: privacy
      name: Privacy Policy
      url: "/privacy-policy/"
      weight: 1
    - identifier: terms
      name: Terms of Service
      url: "/terms/"
      weight: 2
    - identifier: sitemap
      name: Sitemap
      url: "https://luggage-scale.com/blog/sitemap.xml"
      weight: 3
