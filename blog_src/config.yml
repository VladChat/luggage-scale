baseURL: "https://luggage-scale.com/blog/"
title: "Luggage Scale"
theme: "PaperMod"
publishDir: "../blog"
canonifyURLs: false
relativeURLs: false

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  posts: "/posts/:year/:month/:day/:slug/"

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - Sitemap

params:
  env: production
  title: "Luggage Scale"
  description: "Travel news and tips, airline baggage limits."
  keywords: ["luggage scale", "airline baggage limits", "travel tips", "digital travel scale"]
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  assets:
    favicon: "favicon.svg"
  disableGA: true   # отключаем google_analytics.html, чтобы не было ошибки

menu:
  main:
    - identifier: home
      name: Home
      url: "/"
      weight: 1
    - identifier: shop
      name: Shop
      url: "../shop.html"
      weight: 2
    - identifier: manual
      name: Manual
      url: "../manual.html"
      weight: 3
