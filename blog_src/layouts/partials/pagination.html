{{- if gt .TotalPages 1 }}
<nav class="pagination">
  {{- if .HasPrev }}
  <a class="prev" href="{{ .Prev.URL | absURL }}">« Prev</a>
  {{- end }}

  {{- range .Pagers }}
  <a class="{{ if eq .PageNumber $.PageNumber }}active{{ end }}" href="{{ .URL | absURL }}">{{ .PageNumber }}</a>
  {{- end }}

  {{- if .HasNext }}
  <a class="next" href="{{ .Next.URL | absURL }}">Next »</a>
  {{- end }}
</nav>
{{- end }}
