<div class="custom-legal-footer" style="text-align:center; font-size:.9rem; margin-top:.5rem; opacity:0.8;">
  {{ if .Site.Menus.footer }}
    <nav>
      {{- $first := true -}}
      {{- range .Site.Menus.footer -}}
        {{- if not $first -}}&nbsp;·&nbsp;{{- end -}}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{- $first = false -}}
      {{- end -}}
    </nav>
  {{ end }}
</div>
