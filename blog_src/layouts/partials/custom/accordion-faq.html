<!-- layouts/partials/custom/accordion-faq.html -->
<style>
  .faq-accordion {
    margin-top: .5rem;
  }
  .faq-item {
    border: 1px solid var(--border, var(--col-hex-e5e5e5));
    background: var(--entry, var(--col-hex-fff));
    color: var(--content, var(--col-hex-222));
    border-radius: 10px;
    box-shadow: 0 1px 3px var(--col-19090127);
    overflow: hidden;
    margin: .5rem 0;
  }
  .faq-q {
    width: 100%;
    text-align: left;
    padding: .85rem 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 0;
    background: transparent;
    color: inherit;
    transition: background .2s ease, color .2s ease;
  }
  .faq-q:hover { background: var(--col-15188202); }
  body.dark .faq-q:hover { background: var(--col-74974589); }
  .faq-q .label { display: flex; align-items: center; gap: .5rem; }
  .faq-q .mark { font-size: 1.1rem; line-height: 1; transition: transform .22s ease; opacity: .9; }
  .faq-item.open .faq-q .mark { transform: rotate(45deg); }
  .faq-a { max-height: 0; overflow: hidden; transition: max-height 320ms cubic-bezier(.2,.7,.3,1); }
  .faq-a-inner { padding: 0 1rem; }
  .faq-item.open .faq-a-inner { padding: 1rem; }
  .faq-a-inner p { margin: 0; display: flex; align-items: flex-start; gap: .5rem; }
  .faq-a-inner p::before { content: "💡"; flex-shrink: 0; }
</style>

<script>
(function () {
  const i18nFAQ = /(faq|frequently\s+asked\s+questions|вопросы|вопрос-ответ)/i;

  function findFAQContainer() {
    const root = document.querySelector('.post-content');
    if (!root) return null;
    const secs = root.querySelectorAll('.accordion-section');
    for (const sec of secs) {
      const header = sec.querySelector('.accordion-header');
      if (header && i18nFAQ.test((header.textContent || '').trim())) {
        return sec.querySelector('.accordion-content') || sec;
      }
    }
    return null;
  }

  // Улучшенный парсер: извлекает Q/A даже из HTML (<p>, <br> и т.п.)
  function extractQAFromHTML(html) {
    const text = html
      .replace(/<\/p>|<br\s*\/?>/gi, '\n')
      .replace(/<[^>]+>/g, '')
      .replace(/\r/g, '')
      .trim();
    const parts = text.split(/(?=\bQ\s*:)/i);
    const qa = [];
    for (const part of parts) {
      const match = part.match(/Q\s*:\s*(.+?)(?:\s*A\s*:\s*([\s\S]+))?$/i);
      if (match) {
        const q = match[1].trim();
        const a = (match[2] || '').trim();
        if (q && a) qa.push({ q, a });
      }
    }
    return qa;
  }

  function buildAccordion(qa) {
    const acc = document.createElement('div');
    acc.className = 'faq-accordion';
    qa.forEach((item, idx) => {
      const it = document.createElement('div');
      it.className = 'faq-item' + (idx === 0 ? ' open' : '');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'faq-q';
      btn.setAttribute('aria-expanded', idx === 0 ? 'true' : 'false');
      btn.innerHTML = `<span class="label"><strong>Q:</strong> ${escapeHTML(item.q)}</span><span class="mark">+</span>`;
      const aWrap = document.createElement('div');
      aWrap.className = 'faq-a';
      const inner = document.createElement('div');
      inner.className = 'faq-a-inner';
      inner.innerHTML = `<p>${escapeHTML(item.a)}</p>`;
      aWrap.appendChild(inner);
      requestAnimationFrame(() => {
        aWrap.style.maxHeight = idx === 0 ? (inner.scrollHeight + 2) + 'px' : '0px';
      });
      btn.addEventListener('click', () => {
        const isOpen = it.classList.toggle('open');
        btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        aWrap.style.maxHeight = isOpen ? (inner.scrollHeight + 2) + 'px' : '0px';
        acc.querySelectorAll('.faq-item').forEach(other => {
          if (other !== it) {
            other.classList.remove('open');
            const oPanel = other.querySelector('.faq-a');
            const oBtn = other.querySelector('.faq-q');
            if (oPanel) oPanel.style.maxHeight = '0px';
            if (oBtn) oBtn.setAttribute('aria-expanded', 'false');
          }
        });
      });
      it.appendChild(btn);
      it.appendChild(aWrap);
      acc.appendChild(it);
    });
    const recalc = () => {
      acc.querySelectorAll('.faq-item.open .faq-a-inner').forEach(inner => {
        const wrap = inner.parentElement;
        wrap.style.maxHeight = (inner.scrollHeight + 2) + 'px';
      });
    };
    window.addEventListener('resize', recalc, { passive: true });
    acc.querySelectorAll('img').forEach(img => img.addEventListener('load', recalc, { once: true }));
    return acc;
  }

  function injectJSONLD(qa) {
    if (!qa.length) return;
    const ld = {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": qa.map(x => ({
        "@type": "Question",
        "name": x.q,
        "acceptedAnswer": { "@type": "Answer", "text": x.a }
      }))
    };
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.id = 'auto-faq-jsonld';
    s.textContent = JSON.stringify(ld);
    document.head.appendChild(s);
  }

  function escapeHTML(str) {
    return (str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  document.addEventListener('DOMContentLoaded', function () {
    const container = findFAQContainer();
    if (!container) return;
    const html = container.innerHTML || '';
    const qa = extractQAFromHTML(html);
    if (!qa.length) return;
    const acc = buildAccordion(qa);
    container.innerHTML = '';
    container.appendChild(acc);
    injectJSONLD(qa);
  });
})();
</script>
