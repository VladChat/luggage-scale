<style>
  .faq-accordion { margin-top: .5rem; }
  .faq-item {
    border: 1px solid var(--border, #e5e5e5);
    background: var(--entry, #fff);
    color: var(--content, #222);
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    overflow: hidden;
    margin: .5rem 0;
  }

  .faq-q {
    width: 100%;
    text-align: left;
    padding: .85rem 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    border: 0; background: transparent; color: inherit;
    transition: background .2s ease, color .2s ease;
  }
  .faq-q:hover { background: rgba(0,0,0,.04); }
  body.dark .faq-q:hover { background: rgba(255,255,255,.04); }

  .faq-q .label { display: flex; align-items: center; gap: .5rem; }
  .faq-q .mark  { font-size: 1.1rem; line-height: 1; transition: transform .22s ease; opacity: .9; }
  .faq-item.open .faq-q .mark { transform: rotate(45deg); }

  /* Контейнер, в котором анимируем только высоту */
  .faq-a {
    max-height: 0;
    overflow: hidden;
    transition: max-height 320ms cubic-bezier(.2,.7,.3,1);
  }

  /* Внутренняя обёртка — здесь паддинги контента */
  .faq-a-inner {
    padding: 0 1rem;          /* в закрытом состоянии — только горизонтальные */
  }
  .faq-item.open .faq-a-inner {
    padding: 1rem;            /* при открытии добавляем вертикальные отступы */
  }

  .faq-a-inner p {
    margin: 0;
    display: flex;
    align-items: flex-start;
    gap: .5rem;
  }
  .faq-a-inner p::before {
    content: "💡";            /* иконка для ответа */
    flex-shrink: 0;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const isFaqTitle = (txt) => /(^|\b)(faq|frequently asked questions|вопросы|вопрос-ответ)/i.test(txt.trim());

  function buildFaqAccordion(root) {
    if (!root) return;

    const text = root.innerText;
    const parts = text.split(/(?=Q:)/i).map(s => s.trim()).filter(Boolean);

    const items = [];
    parts.forEach(p => {
      const match = p.match(/^Q:\s*(.+?)(?:\s*A:\s*(.+))?$/is);
      if (match) {
        items.push({
          q: match[1].trim(),
          a: (match[2] || "").trim()
        });
      }
    });

    if (!items.length) return;

    const cont = document.createElement('div');
    cont.className = 'faq-accordion';

    items.forEach((it, idx) => {
      const item = document.createElement('div');
      item.className = 'faq-item' + (idx === 0 ? ' open' : '');

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'faq-q';
      btn.setAttribute('aria-expanded', idx === 0 ? 'true' : 'false');
      btn.innerHTML = `<span class="label">❓ ${it.q}</span><span class="mark">+</span>`;

      const ans = document.createElement('div');
      ans.className = 'faq-a';
      ans.innerHTML = `<div class="faq-a-inner"><p>${it.a}</p></div>`;

      const inner = ans.firstElementChild;

      // Открываем первый пункт корректно (с учётом паддингов inner)
      if (idx === 0) {
        requestAnimationFrame(() => {
          ans.style.maxHeight = (inner.scrollHeight + 2) + 'px';
        });
      }

      btn.addEventListener('click', () => {
        const willOpen = !item.classList.contains('open');

        // закрываем остальные
        cont.querySelectorAll('.faq-item').forEach(el => {
          if (el !== item) {
            el.classList.remove('open');
            el.querySelector('.faq-a').style.maxHeight = '0px';
            el.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
          }
        });

        item.classList.toggle('open', willOpen);
        btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');

        if (willOpen) {
          // ждём применения класса .open (появятся вертикальные паддинги у inner)
          requestAnimationFrame(() => {
            ans.style.maxHeight = (inner.scrollHeight + 2) + 'px'; // +2px запас против округления
          });
        } else {
          ans.style.maxHeight = '0px';
        }
      });

      item.appendChild(btn);
      item.appendChild(ans);
      cont.appendChild(item);
    });

    root.innerHTML = "";
    root.appendChild(cont);

    // Пересчёт высоты открытого ответа при ресайзе/догрузке картинок/шрифтов
    const recalcOpenHeights = () => {
      cont.querySelectorAll('.faq-item.open').forEach(el => {
        const a = el.querySelector('.faq-a');
        const inner = el.querySelector('.faq-a-inner');
        a.style.maxHeight = (inner.scrollHeight + 2) + 'px';
      });
    };
    window.addEventListener('resize', recalcOpenHeights, { passive: true });
    cont.querySelectorAll('img').forEach(img => img.addEventListener('load', recalcOpenHeights, { once:true }));
  }

  // ищем «FAQ» в секционном аккордеоне
  setTimeout(() => {
    let faqContent = null;
    document.querySelectorAll('.accordion-section').forEach(sec => {
      const h = sec.querySelector('.accordion-header');
      if (h && isFaqTitle(h.textContent)) {
        faqContent = sec.querySelector('.accordion-content');
      }
    });
    if (faqContent) buildFaqAccordion(faqContent);
  }, 0);
});
</script>
