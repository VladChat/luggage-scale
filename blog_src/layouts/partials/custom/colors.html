<style>
  /* ========= PALLETTE ========= */
  :root {
    --brand-blue: #1855c3;     /* основной акцент — чуть темнее и глубже */
    --brand-cyan: #00b8f0;     /* второй акцент — холодный голубой */
    --brand-bg:   #090d13;     /* фон — тёмно-синий графит */
    --brand-card: #131924;     /* карточки — глубокий, но читаемый оттенок */
    --radius: 12px;
    --shadow: 0 6px 16px rgba(2, 6, 23, .28);
  }

  /* Сопоставляем PaperMod-переменные (LIGHT) */
  :root {
    --theme: #f7f9fc;
    --entry: #ffffff;
    --primary: #0f172a;
    --secondary: #334155;
    --tertiary: #64748b;
    --content: #111827;
    --border: #e6e8ec;

    --link-color: var(--brand-blue);
    --link-hover: var(--brand-cyan);
  }

  /* Сопоставляем PaperMod-переменные (DARK) */
  body.dark {
    --theme: var(--brand-bg);
    --entry: var(--brand-card);
    --primary: #e7edf4;
    --secondary: #aab4c2;
    --tertiary: #7c8aa1;
    --content: #d8e0ea;
    --border: #2c3442;

    --link-color: var(--brand-cyan);
    --link-hover: #7bd7ff;
  }

  /* ========= БАЗОВЫЕ ПРИМЕНЕНИЯ ========= */
  .post-content a,
  .page-content a { color: var(--link-color); transition: color .2s ease; }
  .post-content a:hover { color: var(--link-hover); }

  .post-content h2, .post-content h3,
  .post-single .post-title { color: var(--primary); }

  /* Карточки на списке постов */
  .post-entry, .first-entry {
    border-radius: var(--radius);
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  body.dark .post-entry, body.dark .first-entry {
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    background-color: var(--brand-card);
  }

  /* ========= АККОРДЕОН ========= */
  .accordion-section {
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin: 1rem 0;
    overflow: hidden;
    transition: background .3s ease, box-shadow .3s ease;
  }
  body.dark .accordion-section:hover {
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }

  .accordion-header {
    display: flex;
    align-items: center;
    gap: .75rem;
    width: 100%;
    padding: 1rem 1.25rem;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    border: 0;
    cursor: pointer;
    background: linear-gradient(180deg, var(--brand-blue), var(--brand-cyan));
  }

  /* плюс/минус справа */
  .accordion-header::after{
    content: "+";
    margin-left: auto;
    font-weight: 800;
    line-height: 1;
  }
  .accordion-section.open .accordion-header::after{
    content: "–";
  }

  .accordion-content {
    background: var(--entry);
    color: var(--content);
    overflow: hidden;
    max-height: 0;
    padding: 0 1.25rem;
    transition: max-height .35s ease, padding .3s ease;
  }

  .accordion-section.open .accordion-content {
    padding: 1rem 1.25rem;
  }

  .accordion-content blockquote {
    border-left: 3px solid var(--brand-blue);
    padding-left: .85rem;
    margin-left: .25rem;
    opacity: .95;
  }

  /* ==== STATUS GRADIENTS ==== */
  :root {
    --grad-toread:   linear-gradient(135deg, #17b65f, #28d97a);
    --grad-reading:  linear-gradient(135deg, #faae24, #ff8a0d);
    --grad-read:     linear-gradient(135deg, #56607c, #75809b);
  }

  .accordion-section[data-status="toread"]   > .accordion-header { background: var(--grad-toread); }
  .accordion-section[data-status="reading"]  > .accordion-header { background: var(--grad-reading); }

  .accordion-section[data-status] > .accordion-header {
    background: linear-gradient(180deg, var(--brand-blue), var(--brand-cyan));
  }

  .accordion-section[data-status="toread"]  .read-badge { background: var(--grad-toread); }
  .accordion-section[data-status="reading"] .read-badge { background: var(--grad-reading); }
  .accordion-section[data-status="read"]    .read-badge { background: var(--grad-read); }

  /* Бейджи */
  .read-badge {
    color: #fff;
    text-shadow: 0 1px 1px rgba(0,0,0,.25);
    outline: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
</style>
