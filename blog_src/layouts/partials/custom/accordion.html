<!-- partial: custom/accordion.html -->
<style>
@media (max-width: 640px) {
  /* Плашка только в пределах заголовка */
  .accordion-section {
    position: relative;
    border-left: none;
  }

  .accordion-header {
    position: relative;
    padding: 0.7rem 0.3rem 0.7rem 1.6rem; /* уменьшен правый зазор */
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }

  /* Вертикальная плашка */
  .accordion-header::before {
    content: attr(data-status); /* базово — из data-status; ниже переопределим по каждому статусу */
    position: absolute;
    top: 0;
    left: 0;
    width: 22px;
    height: 100%;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
    border-radius: 4px;
    letter-spacing: .5px;
    padding: 2px 0;
    z-index: 1;
  }

  /* Маппинг статусов для мобилки: текст + цвет */
  .accordion-section[data-status="toread"] .accordion-header::before {
    content: "NEXT";
    background: linear-gradient(135deg, #17b65f, #28d97a);
  }
  .accordion-section[data-status="reading"] .accordion-header::before {
    content: "NOW";
    background: linear-gradient(135deg, #faae24, #ff8a0d);
  }
  .accordion-section[data-status="read"] .accordion-header::before {
    content: "READ";
    background: linear-gradient(135deg, #6c757d, #9aa3ad);
  }

  /* Убираем старые плашки только на мобилке */
  .accordion-header .read-badge { display: none !important; }

  .accordion-header .accordion-title {
    position: relative;
    z-index: 2;
    flex: 1;
    color: #fff;
    font-size: 0.92rem;
    font-weight: 700;
    line-height: 1.35;
    word-break: break-word;
  }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const postContent = document.querySelector(".post-content");
  if (!postContent) return;

  const nodes = Array.from(postContent.children);
  const sections = [];
  let cur = null;

  nodes.forEach(node => {
    if (node.tagName === "H2") {
      if (cur) sections.push(cur);
      cur = { h: node, body: [] };
    } else if (cur) cur.body.push(node);
  });
  if (cur) sections.push(cur);
  if (sections.length < 2) return;

  postContent.innerHTML = "";

  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SCROLL_OFFSET = parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue("--accordion-offset")) || 96;

  sections.forEach((sec, idx) => {
    const wrapper = document.createElement("section");
    wrapper.className = "accordion-section" + (idx === 0 ? " open" : "");
    wrapper.dataset.status = (idx === 0) ? "reading" : "toread";
    wrapper.style.scrollMarginTop = SCROLL_OFFSET + "px";

    const header = document.createElement("button");
    header.type = "button";
    header.className = "accordion-header";
    header.setAttribute("aria-expanded", idx === 0 ? "true" : "false");
    header.dataset.status = wrapper.dataset.status;

    const title = document.createElement("span");
    title.className = "accordion-title";
    title.textContent = sec.h.textContent;
    header.appendChild(title);

    const content = document.createElement("div");
    content.className = "accordion-content";
    content.style.overflow = "hidden";
    content.style.transition = "max-height 320ms cubic-bezier(.2,.7,.3,1)";
    content.style.maxHeight = "0px";
    sec.body.forEach(el => content.appendChild(el));

    requestAnimationFrame(() => {
      if (idx === 0) {
        wrapper.classList.add("open");
        content.style.maxHeight = content.scrollHeight + "px";
      }
    });

    header.addEventListener("click", () => {
      const willOpen = !wrapper.classList.contains("open");

      postContent.querySelectorAll(".accordion-section.open").forEach(secEl => {
        if (secEl === wrapper) return;
        secEl.classList.remove("open");
        const c = secEl.querySelector(".accordion-content");
        if (c) c.style.maxHeight = "0px";
        secEl.dataset.status = "read";
        const hdr = secEl.querySelector(".accordion-header");
        if (hdr) hdr.dataset.status = "read";
      });

      if (willOpen) {
        wrapper.classList.add("open");
        content.style.maxHeight = "0px";
        content.offsetHeight;
        content.style.maxHeight = content.scrollHeight + "px";

        const scrollAfter = () =>
          wrapper.scrollIntoView({ behavior: "smooth", block: "start" });
        if (prefersReduced) scrollAfter();
        else content.addEventListener("transitionend", scrollAfter, { once: true });

        wrapper.dataset.status = "reading";
        header.dataset.status = "reading";
      } else {
        wrapper.classList.remove("open");
        content.style.maxHeight = "0px";
        wrapper.dataset.status = "read";
        header.dataset.status = "read";
      }
    });

    wrapper.appendChild(header);
    wrapper.appendChild(content);
    postContent.appendChild(wrapper);
  });
});
</script>
