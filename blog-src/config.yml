baseURL: "https://luggage-scale.com/blog/"
title: "Luggage Scale Blog"
pagination:
  pagerSize: 10

theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

mainSections:
  - posts

params:
  env: production
  title: "Luggage Scale Blog"
  description: "Travel tips, airline baggage limits, and smart packing with a digital luggage scale."
  keywords: ["luggage scale", "airline baggage limits", "travel tips", "digital travel scale"]
  images: []
  DateFormat: "January 2, 2006"

  defaultTheme: auto
  disableThemeToggle: false
  disableScrollToTop: false

  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  UseHugoToc: true
  showtoc: true
  tocopen: false

  label:
    text: "uPatch"

menu:
  main:
    - name: "Home"
      url: "/blog/"
      weight: 10
    - name: "Shop"
      url: "/shop.html"
      weight: 20
    - name: "Manual"
      url: "/manual.html"
      weight: 30
    - name: "Airline Limits"
      url: "/flight-baggage-limits.html"
      weight: 40
    - name: "Warranty"
      url: "/warranty.html"
      weight: 50
